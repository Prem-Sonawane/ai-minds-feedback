<!doctype html><body><script>
function scan(src){return new Promise(res=>{const im=new Image();im.onload=()=>{
const c=document.createElement("canvas");c.width=1123;c.height=794;const g=c.getContext("2d");
g.drawImage(im,0,0,1123,794);
const X0=400,X1=760,Y0=350,Y1=490;
const d=g.getImageData(X0,Y0,X1-X0,Y1-Y0).data;
let navyTop=-1,navyBot=-1,goldTop=-1,goldBot=-1;
for(let y=0;y<Y1-Y0;y++){let nav=0,gold=0;
for(let x=0;x<X1-X0;x++){const i=(y*(X1-X0)+x)*4,r=d[i],gg=d[i+1],b=d[i+2];
if(r<40&&gg<55&&b>85&&b<130) nav++;
if(r>170&&r<225&&gg>135&&gg<190&&b>50&&b<115) gold++;}
if(nav>15){if(navyTop<0)navyTop=y+Y0;navyBot=y+Y0;}
if(gold>15){if(goldTop<0)goldTop=y+Y0;goldBot=y+Y0;}}
res({navyTop,navyBot,goldTop,goldBot});};im.src=src;});}
(async()=>{const a=await scan("dom.png"),b=await scan("final3.png");
document.body.setAttribute("data-r",JSON.stringify({dom:a,h2c:b}));})();
</script></body>
