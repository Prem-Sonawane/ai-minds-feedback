<!doctype html><body><script>
function segs(src,X0,X1,Y0,Y1,min){return new Promise(res=>{const im=new Image();im.onload=()=>{
const c=document.createElement("canvas");c.width=1123;c.height=794;const g=c.getContext("2d");
g.drawImage(im,0,0,1123,794);const d=g.getImageData(X0,Y0,X1-X0,Y1-Y0).data;
const out=[];let cur=null;
for(let y=0;y<Y1-Y0;y++){let n=0;
for(let x=0;x<X1-X0;x++){const i=(y*(X1-X0)+x)*4;
if(d[i]<45&&d[i+1]<60&&d[i+2]>85&&d[i+2]<135)n++;}
if(n>min){if(!cur)cur=[y+Y0,y+Y0];else cur[1]=y+Y0;}
else if(cur){out.push(cur);cur=null;}}
if(cur)out.push(cur);res(out);};im.src=src;});}
(async()=>{
const dom=await segs("h2c5.png",430,700,100,760,6);
const h2c=await segs("h2c4.png",430,700,100,760,6);
document.body.setAttribute("data-r",JSON.stringify({dom,h2c}));})();
</script></body>
